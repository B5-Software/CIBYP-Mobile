plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
    namespace 'org.b5software.cibyp.phone'
    compileSdkVersion 'android-37.0'
    defaultConfig { applicationId 'org.b5software.cibyp.remote'; minSdk 26; targetSdk 36; versionCode 3; versionName '0.1.0-alpha.3'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs.useLegacyPackaging = false }
    signingConfigs { debug { storeFile rootProject.file('ci/development.p12'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
}
dependencies {
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation project(':core')
    implementation platform('androidx.compose:compose-bom:2026.01.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.12.2'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.navigation:navigation-compose:2.9.6'
    implementation 'info.guardianproject:tor-android:0.4.9.12'
    implementation 'com.netzarchitekten:IPtProxy:5.5.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.01.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
