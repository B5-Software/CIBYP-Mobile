plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
    namespace 'org.b5software.cibyp.wear'
    compileSdk 36
    defaultConfig { applicationId 'org.b5software.cibyp.remote'; minSdk 30; targetSdk 36; versionCode 2; versionName '0.1.0-alpha.2'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { storeFile rootProject.file('ci/development.p12'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { release { minifyEnabled true; shrinkResources true; signingConfig signingConfigs.debug; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') } }
}
dependencies {
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation project(':core')
    implementation platform('androidx.compose:compose-bom:2026.01.00')
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.12.2'
    implementation 'androidx.wear.compose:compose-material3:1.5.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.01.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
