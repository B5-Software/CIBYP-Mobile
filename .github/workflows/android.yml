name: Android and Wear OS
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy SDK 'tools' package is no longer published.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Shared development signing identity
        # Both APKs must have the same certificate for the Wear Data Layer.
        # This development identity is intentionally public and not a release signing key.
        run: |
          mkdir -p "$HOME/.android"
          keytool -importkeystore -srckeystore ci/development.p12 -srcstoretype PKCS12 -srcstorepass android -destkeystore "$HOME/.android/debug.keystore" -deststorepass android -noprompt
      - name: Build, test and lint
        run: chmod +x gradlew && ./gradlew :core:testDebugUnitTest :phone:assembleDebug :wear:assembleRelease :phone:lintDebug :wear:lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CIBYP-Android-WearOS
          path: |
            phone/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/release/*.apk
            core/build/test-results/testDebugUnitTest/*.xml
            phone/build/reports/lint-results-debug.html
            wear/build/reports/lint-results-release.html
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CIBYP-Android-WearOS
          path: artifacts
      - name: Publish development MVP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find artifacts -name '*.apk' -exec sha256sum {} \; > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" artifacts/phone/build/outputs/apk/debug/phone-debug.apk artifacts/wear/build/outputs/apk/release/wear-release.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --prerelease --title "CIBYP Mobile $GITHUB_REF_NAME" --notes "Development MVP: phone and optimized watch APKs use the same public development signing identity. Install both together. Desktop commands run on your own CIBYP backend."
